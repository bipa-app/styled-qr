[package]
name = "styled-qr-wasm"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings of styled-qr, published to npm as @bipa-app/styled-qr"
license = "MIT"
repository = "https://github.com/bipa-app/styled-qr"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25.0", default-features = false, features = ["png"] }
serde = { version = "1.0.210", default-features = false, features = ["derive", "std"] }
serde-wasm-bindgen = "0.6.5"
styled-qr = { path = ".." }
wasm-bindgen = "=0.2.100"
