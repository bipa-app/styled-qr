[package]
name = "styled-qr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Styled QR codes with exact anti-aliasing, logos, and PNG and SVG output"
license = "MIT"
repository = "https://github.com/bipa-app/styled-qr"
readme = "README.md"
keywords = ["qrcode", "qr", "svg", "png", "logo"]
categories = ["encoding", "graphics", "multimedia::images"]

[dependencies]
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
image = { version = "0.25.0", default-features = false, features = ["png"] }
qrcode = { version = "0.14.0", default-features = false }
thiserror = { version = "2.0.3", default-features = false }

[dev-dependencies]
quircs = { version = "0.10.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = 0 }
pedantic = { level = "warn", priority = 1 }
allow_attributes = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
as_conversions = { level = "warn", priority = 2 }
implicit_clone = { level = "warn", priority = 2 }
panic = { level = "warn", priority = 2 }
redundant_test_prefix = { level = "warn", priority = 2 }
redundant_type_annotations = { level = "warn", priority = 2 }
str_to_string = { level = "warn", priority = 2 }
todo = { level = "warn", priority = 2 }
try_err = { level = "warn", priority = 2 }
unimplemented = { level = "warn", priority = 2 }
unwrap_used = { level = "warn", priority = 2 }
inconsistent_digit_grouping = { level = "allow", priority = 3 }
missing_errors_doc = { level = "allow", priority = 3 }
missing_panics_doc = { level = "allow", priority = 3 }
too_many_lines = { level = "allow", priority = 3 }
unreadable_literal = { level = "allow", priority = 3 }
